name: Portfolio quality checks
on:
  push:
    branches: ["main", "portfolio/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check premium-v3.js
      - name: Run portfolio smoke tests
        run: node tests/smoke-test.mjs
